<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Title + description are hardcoded here (not pulled from src/config.js)
      because index.html is read by browsers/crawlers before React ever runs.
      If you reuse this site for a different salon, update these two tags
      AND src/config.js so they stay in sync.
    -->
    <title>Still Waters Grooming | Luxury Dog Spa in Menifee, CA</title>
    <meta
      name="description"
      content="Still Waters Grooming is a luxury dog spa in Menifee, CA offering calm, private 1:1 grooming appointments with a professional pet stylist of 20+ years."
    />

    <link rel="icon" type="image/webp" href="/assets/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
